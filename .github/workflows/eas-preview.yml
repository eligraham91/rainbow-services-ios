name: EAS Preview Update

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  preview:
    name: EAS OTA Preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA preview update
        id: eas-update
        run: |
          OUTPUT=$(eas update --auto --branch=pr-${{ github.event.pull_request.number }} --message "PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}" --json 2>/dev/null || echo '[]')
          echo "update_output=$OUTPUT" >> $GITHUB_OUTPUT

      - name: Post preview link to PR
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: pr-${{ github.event.pull_request.number }}
        with:
          script: |
            const branch = process.env.BRANCH;
            const prNumber = process.env.PR_NUMBER;
            const expLink = `exp+starthere://expo-development-client/?url=https://u.expo.dev/rainbow-services-start-here/branches/${branch}`;
            const body = [
              `## 📱 Preview Ready`,
              ``,
              `**exp:// deep link (tap on iPhone):**`,
              `\`\`\``,
              expLink,
              `\`\`\``,
              ``,
              `**Or scan QR with Expo Go:**`,
              `https://qr.expo.dev/eas-update?slug=rainbow-services-start-here&projectId=rainbow-services-start-here&channel=pr-${prNumber}`,
              ``,
              `> OTA update published to branch \`${branch}\` · Rainbow Services / Start Here`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(prNumber),
              body,
            });
